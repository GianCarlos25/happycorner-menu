<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Corner · Carta</title>
<meta name="description" content="Carta de especialidades y desayunos de Happy Corner." />
<meta name="theme-color" content="#ffc531" />

<!-- Open Graph: vista previa bonita al compartir el enlace por WhatsApp,
     Instagram, etc. Si cambiáis el dominio (Netlify/GitHub Pages/dominio
     propio), actualizad "og:url" y "og:image" con la URL nueva. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Happy Corner · Carta" />
<meta property="og:description" content="Carta de especialidades y desayunos de Happy Corner." />
<meta property="og:image" content="https://happy-corner-menu.netlify.app/assets/desayuno.jpg" />
<meta property="og:url" content="https://happy-corner-menu.netlify.app/" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="assets/logo.png" />

<!-- Tipografía: Fredoka para títulos (redondeada, con carácter, a juego
     con el logo) + una fuente de sistema neutra para el texto de cuerpo,
     para no perder legibilidad en descripciones largas. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />

<!-- Iconos: Font Awesome (gratis, vía CDN) en vez de los SVG genéricos
     dibujados a mano — mismo criterio en toda la web. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="hero">
  <div class="wrap">
    <img class="logo" src="assets/logo.png" alt="Happy Corner" />
    <p class="hero-tagline" id="hero-tagline">¡Desayuna bien!</p>
    <p class="hero-subtitle" id="hero-subtitle"></p>
    <p class="hero-note" id="hero-note"></p>
  </div>
  <div class="hero-photo" id="hero-photo"></div>
</header>

<nav class="section-nav" id="section-nav"></nav>

<div class="wrap">
  <main id="menu-sections"></main>

  <footer>
    <p id="footer-text"></p>
    <p class="brand-line">Happy Corner</p>
  </footer>
</div>

<!-- Botón flotante + panel "Mi Selección" (modelo híbrido, sin pago: el
     cliente arma su pedido aquí y se lo enseña/lee al camarero). -->
<button type="button" class="cart-fab" id="cart-fab" aria-label="Ver mi selección">
  <span class="cart-fab-icon">
    <i class="fa-solid fa-bag-shopping fa-icon" aria-hidden="true"></i>
    <span class="cart-fab-count" id="cart-count-badge">0</span>
  </span>
  <span class="cart-fab-info">
    <span class="cart-fab-label">Mi selección</span>
    <span class="cart-fab-total" id="fab-total">0,00 €</span>
  </span>
</button>

<div class="cart-overlay" id="cart-overlay"></div>

<div class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title">
  <div class="cart-drawer-handle"></div>
  <div class="cart-drawer-header">
    <h2 id="cart-drawer-title">Mi Selección</h2>
    <button type="button" class="cart-drawer-close" id="cart-drawer-close" aria-label="Cerrar"><i class="fa-solid fa-xmark fa-icon" aria-hidden="true"></i></button>
  </div>
  <div class="cart-drawer-list" id="cart-items"></div>
  <div class="cart-drawer-footer">
    <div class="cart-drawer-total-row">
      <span>Total</span>
      <span id="cart-total-value">0,00 €</span>
    </div>
    <p class="cart-drawer-hint">Muéstrale esta pantalla al camarero para hacer tu pedido — no se paga desde aquí.</p>
    <button type="button" class="cart-clear-btn" id="cart-clear-btn">Vaciar selección</button>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
